# Configuración para Nixpacks / Dockploy — backend + frontend en un contenedor
# Usa la detección automática de Node.js + nginx personalizado

[phases.setup]
# Instalar nginx en el contenedor
nixPkgs = ["nginx"]

[phases.build]
# Build del frontend (necesita VITE_API_URL)
cmds = [
  "cd backend && npm ci --omit=dev",
  "cd ../frontend && npm ci",
  "npm run build"
]

[phases.start]
# Script que arranca nginx y el backend en paralelo
cmd = "./deploy/start-contenedor.sh"

# Variables de entorno requeridas (configúralas en Dockploy)
[variables]
NODE_ENV = "production"
PORT = "3000"
TRUST_PROXY = "1"
# Configura estas en Dockploy:
# DB_HOST, DB_USER, DB_PASSWORD, DB_NAME
# JWT_SECRET (genera uno nuevo)
# CORS_ORIGIN = "https://bandeos.xiaomibolivia.tech"
