# /etc/nginx/sites-available/bundlesystem
# Frontend estático (Vite build) + proxy del API al backend Node.js

# --- Frontend ---
server {
    listen 80;
    server_name bandeos.xiaomibolivia.tech;

    root /var/www/bundlesystem/frontend/dist;
    index index.html;

    # Archivos estáticos con caché
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Subida de imágenes (multipart, hasta ~8MB + margen)
    location /api/v1/bundle-delivered/upload-picture {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → backend Express
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: cualquier ruta que no sea archivo va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API en subdominio separado (opcional) ---
